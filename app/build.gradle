plugins {
    id "com.android.application"
}

android {
    namespace "uz.namozvaqti.app"
    compileSdk 34

    defaultConfig {
        applicationId "uz.namozvaqti.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
